[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "omi_shapeforge"
version = "0.1.0"
description = "OMI ShapeForge: workflows for stereo depth, reconstruction and registration"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = []

[project.scripts]
omi-shapeforge = "omi_shapeforge.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
