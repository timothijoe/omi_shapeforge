<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>插座与光模块 · 点云配准</title>
<style>body{margin:0;background:#101720;color:#e8edf4;font:15px system-ui}header{padding:12px 18px;background:#192431}h1{font-size:20px;margin:0 0 8px}p{margin:6px 0;line-height:1.5}.bar{padding:10px 18px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}button,select{background:#26384a;color:white;border:1px solid #587086;border-radius:5px;padding:7px;font:inherit}canvas{display:block;width:100%;height:calc(100vh - 245px);min-height:420px;touch-action:none}#info{padding:10px 18px}#fallback{display:none;max-width:100%}</style>
<header><h1>插座 OS-001 r04 ＋光模块 V3</h1><p><span style="color:#53dbff">蓝色：插座</span>　<span style="color:#ffb952">橙色：光模块主体</span>　灰色：原始点云。绿色拉环／挂件不参与配准，默认隐藏。</p><p>插座为粗配准候选，光模块保持已确认的翻面结果；两者独立定位，没有强制插合。__METRICS__</p></header>
<div class="bar"><button id="focus">装配局部</button><button id="whole">完整点云</button><button id="reset">重置视角</button><select id="candidate"></select><label><input id="socket" type="checkbox" checked>插座</label><label><input id="module" type="checkbox" checked>光模块</label><label><input id="handle" type="checkbox">绿色挂件（仅显示）</label><label><input id="stand" type="checkbox">下部支架（未验证）</label><label><input id="local" type="checkbox" checked>局部点云</label><label><input id="highlight" type="checkbox">插座拟合点</label><label><input id="wire" type="checkbox" checked>轮廓线</label><label>透明度 <input id="opacity" type="range" min="0" max="0.8" step="0.05" value="0.25"></label></div>
<canvas id="cloud"></canvas><img id="fallback" src="preview.png"><p id="info"></p>
<script>
window.addEventListener('error',e=>{document.getElementById('info').textContent='浏览器未能显示 3D，请使用软件渲染窗口；下面为预览图。'+e.message;document.getElementById('cloud').style.display='none';document.getElementById('fallback').style.display='block';});
const payload=__PAYLOAD__;
function floats(b){const s=atob(b),u=new Uint8Array(s.length);for(let i=0;i<s.length;i++)u[i]=s.charCodeAt(i);return new Float32Array(u.buffer)}
const data=floats(payload.cloud),cases=payload.candidates,canvas=document.getElementById('cloud'),gl=canvas.getContext('webgl',{antialias:true});if(!gl)throw Error('WebGL unavailable');
function shader(t,s){const x=gl.createShader(t);gl.shaderSource(x,s);gl.compileShader(x);if(!gl.getShaderParameter(x,gl.COMPILE_STATUS))throw Error(gl.getShaderInfoLog(x));return x}
function program(v,f){const p=gl.createProgram();gl.attachShader(p,shader(gl.VERTEX_SHADER,v));gl.attachShader(p,shader(gl.FRAGMENT_SHADER,f));gl.linkProgram(p);if(!gl.getProgramParameter(p,gl.LINK_STATUS))throw Error(gl.getProgramInfoLog(p));return p}
const common='uniform vec3 center;uniform vec4 view;uniform float aspect;uniform vec2 pan;';
const project=`vec4 projectWorld(vec3 world){vec3 p=world-center;p.y=-p.y;float a=view.x,b=view.y;vec3 r=vec3(cos(a)*p.x+sin(a)*p.z,p.y,-sin(a)*p.x+cos(a)*p.z);r=vec3(r.x,cos(b)*r.y-sin(b)*r.z,sin(b)*r.y+cos(b)*r.z);r.xy+=pan;float z=r.z+view.z;float n=.001,f=100.;return vec4(1.5*r.x/aspect,1.5*r.y,(f+n)/(f-n)*z-2.*f*n/(f-n),z);}`;
const pp=program('attribute vec3 pos;attribute float gray;attribute float roi;'+common+'uniform float localOnly;uniform float highlight;uniform vec3 focusCenter;varying vec3 col;'+project+'void main(){if(localOnly>.5&&distance(pos,focusCenter)>.14){gl_Position=vec4(2.,2.,2.,1.);gl_PointSize=0.;return;}gl_Position=projectWorld(pos);gl_PointSize=view.w;col=mix(vec3(gray),vec3(.1,.85,1.),roi*highlight*.8);}','precision mediump float;varying vec3 col;void main(){gl_FragColor=vec4(col,1.);}');
const mp=program('attribute vec3 pos;attribute vec3 normal;uniform mat4 model;'+common+'varying float light;'+project+'void main(){vec3 p=(model*vec4(pos,1.)).xyz;vec3 n=mat3(model)*normal;light=.5+.5*abs(dot(normalize(n+vec3(.000001)),normalize(vec3(-.4,-.3,-1.))));gl_Position=projectWorld(p);}','precision mediump float;uniform vec4 tint;varying float light;void main(){gl_FragColor=vec4(tint.rgb*light,tint.a);}');
function buffer(a){const b=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,b);gl.bufferData(gl.ARRAY_BUFFER,a,gl.STATIC_DRAW);return b}
const cb=buffer(data),rb=buffer(floats(payload.roi));const groups=payload.groups.map(g=>{const m=floats(g.mesh),l=floats(g.lines);return {...g,mb:buffer(m),lb:buffer(l),mc:m.length/6,lc:l.length/6}});
let caseIndex=0,center=payload.focus.slice(),yaw=-.3,pitch=-.5,distance=.24,pan=[0,0],drag=false,last=[];
function uniforms(p){gl.useProgram(p);gl.uniform3fv(gl.getUniformLocation(p,'center'),center);gl.uniform4f(gl.getUniformLocation(p,'view'),yaw,pitch,distance,2*devicePixelRatio);gl.uniform1f(gl.getUniformLocation(p,'aspect'),canvas.width/canvas.height);gl.uniform2fv(gl.getUniformLocation(p,'pan'),pan)}
function attr(p,n,b,size,stride,off){const l=gl.getAttribLocation(p,n);if(l<0)return;gl.bindBuffer(gl.ARRAY_BUFFER,b);gl.enableVertexAttribArray(l);gl.vertexAttribPointer(l,size,gl.FLOAT,false,stride,off)}
function clearAttrs(){for(let i=0;i<gl.getParameter(gl.MAX_VERTEX_ATTRIBS);i++)gl.disableVertexAttribArray(i)}
function matrix(T){const a=[];for(let c=0;c<4;c++)for(let r=0;r<4;r++)a.push(T[r][c]);return new Float32Array(a)}
function render(){canvas.width=Math.round(canvas.clientWidth*devicePixelRatio);canvas.height=Math.round(canvas.clientHeight*devicePixelRatio);gl.viewport(0,0,canvas.width,canvas.height);gl.clearColor(.05,.08,.12,1);gl.clear(gl.COLOR_BUFFER_BIT|gl.DEPTH_BUFFER_BIT);gl.enable(gl.DEPTH_TEST);gl.depthMask(true);gl.disable(gl.BLEND);clearAttrs();uniforms(pp);attr(pp,'pos',cb,3,16,0);attr(pp,'gray',cb,1,16,12);attr(pp,'roi',rb,1,4,0);gl.uniform1f(gl.getUniformLocation(pp,'localOnly'),document.getElementById('local').checked?1:0);gl.uniform1f(gl.getUniformLocation(pp,'highlight'),document.getElementById('highlight').checked?1:0);gl.uniform3fv(gl.getUniformLocation(pp,'focusCenter'),payload.focus);gl.drawArrays(gl.POINTS,0,data.length/4);
 for(const g of groups){if(!document.getElementById(g.toggle).checked)continue;clearAttrs();uniforms(mp);gl.uniformMatrix4fv(gl.getUniformLocation(mp,'model'),false,matrix(g.object==='socket'?cases[caseIndex].T:payload.module_T));gl.enable(gl.BLEND);gl.blendFunc(gl.SRC_ALPHA,gl.ONE_MINUS_SRC_ALPHA);gl.depthMask(false);attr(mp,'pos',g.mb,3,24,0);attr(mp,'normal',g.mb,3,24,12);gl.uniform4f(gl.getUniformLocation(mp,'tint'),...g.color,Number(document.getElementById('opacity').value));gl.drawArrays(gl.TRIANGLES,0,g.mc);if(document.getElementById('wire').checked){attr(mp,'pos',g.lb,3,24,0);attr(mp,'normal',g.lb,3,24,12);gl.uniform4f(gl.getUniformLocation(mp,'tint'),...g.color,1.);gl.drawArrays(gl.LINES,0,g.lc)}gl.depthMask(true)}
 document.getElementById('info').textContent='原始点云 '+data.length/4+' 点 · 插座候选 '+(caseIndex+1)+' · 拖动旋转，滚轮缩放，Shift＋拖动平移。插口对应关系仍需复核；绿色挂件没有用于求解。';}
const choice=document.getElementById('candidate');cases.forEach((c,i)=>{const e=document.createElement('option');e.value=i;e.textContent='插座候选 '+(i+1)+'（几何评分 '+c.score.toFixed(2)+'）';choice.appendChild(e)});choice.onchange=()=>{caseIndex=Number(choice.value);render()};
document.getElementById('focus').onclick=()=>{center=payload.focus.slice();distance=.19;pan=[0,0];document.getElementById('local').checked=true;render()};document.getElementById('whole').onclick=()=>{center=payload.scene_center.slice();distance=3.;pan=[0,0];yaw=pitch=0;document.getElementById('local').checked=false;render()};document.getElementById('reset').onclick=()=>{center=payload.focus.slice();distance=.24;yaw=-.3;pitch=-.5;pan=[0,0];render()};
for(const id of ['socket','module','handle','stand','local','highlight','wire','opacity'])document.getElementById(id).oninput=render;
canvas.onpointerdown=e=>{drag=true;last=[e.clientX,e.clientY];canvas.setPointerCapture(e.pointerId)};canvas.onpointerup=()=>drag=false;canvas.onpointermove=e=>{if(!drag)return;const dx=e.clientX-last[0],dy=e.clientY-last[1];last=[e.clientX,e.clientY];if(e.shiftKey){pan[0]+=dx*distance/800;pan[1]-=dy*distance/800}else{yaw+=dx*.008;pitch+=dy*.008}render()};canvas.addEventListener('wheel',e=>{e.preventDefault();distance=Math.max(.025,distance*Math.exp(e.deltaY*.001));render()},{passive:false});window.onresize=render;render();
</script></html>
